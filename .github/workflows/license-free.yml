name: License-free checks

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: C# syntax and Unity metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.427'
      - name: Check tracked assets (no Unity or secrets)
        shell: pwsh
        run: ./tools/check-license-free.ps1
      - name: Verify checker rejects broken temporary copies
        shell: pwsh
        run: ./tools/test-license-free.ps1
